<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据治理工作台</title>
<style>
:root{
  --bg:#f7f4ec;--paper:#fffdf8;--paper-soft:#fbf8f0;--ink:#2d312d;--muted:#858980;
  --line:#e6e0d3;--line-dark:#d8d1c2;--green:#82a953;--green-dark:#6f9345;--green-soft:#eef4e5;
  --brown:#aa8866;--red:#b65b52;--red-soft:#faece8;--shadow:0 2px 8px rgba(62,55,39,.05),0 12px 30px rgba(62,55,39,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.hidden{display:none!important}.muted{color:var(--muted)}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.topbar{height:60px;background:rgba(255,253,248,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:750;letter-spacing:-.5px;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center}
.brand small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:2px}
.main-nav{display:flex;align-items:stretch;height:100%;gap:3px;min-width:0}
.nav-item{position:relative;display:flex;align-items:center}
.nav-link{height:100%;border:0;background:transparent;color:#555b53;padding:0 13px;display:flex;align-items:center;gap:7px;position:relative;white-space:nowrap;font-size:13px}
.nav-link:hover{color:var(--green-dark);background:#faf7ef}
.nav-link.active{color:var(--green-dark);font-weight:650}
.nav-link.active:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--green);border-radius:2px}
.nav-count{font-size:10px;color:var(--muted);background:#f3efe5;border-radius:8px;padding:0 5px;line-height:16px}
.chevron{width:12px;height:12px;transition:transform .18s}.nav-item.open .chevron{transform:rotate(180deg)}
.dropdown{display:none;position:absolute;top:54px;left:0;width:310px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 42px rgba(62,55,39,.14);padding:8px;max-height:calc(100vh - 86px);overflow:auto}
.nav-item.open .dropdown{display:block}
.dropdown-title{padding:7px 10px 8px;color:var(--muted);font-size:11px;letter-spacing:.8px}
.dropdown-link{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink)}
.dropdown-link:hover,.dropdown-link.active{background:var(--green-soft);color:var(--green-dark)}
.dropdown-link .item-icon{width:30px;height:30px;border-radius:8px;background:#f4f0e6;display:grid;place-items:center;color:#7b806f}
.dropdown-link:hover .item-icon{background:#fff;color:var(--green-dark)}
.dropdown-link b{display:block;font-size:13px;font-weight:600}.dropdown-link small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.env{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;background:var(--paper-soft);border:1px solid var(--line);padding:4px 9px;border-radius:16px}
.env-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.user-wrap{position:relative}.user-button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:5px 7px;border-radius:8px}.user-button:hover{background:var(--paper-soft)}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#ede7da;color:#776650;font-size:12px;font-weight:700}
.user-menu{display:none;position:absolute;right:0;top:43px;width:210px;background:var(--paper);border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 34px rgba(62,55,39,.14);padding:7px}.user-wrap.open .user-menu{display:block}
.user-summary{padding:9px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}.user-summary b{display:block}.user-summary span{font-size:12px;color:var(--muted)}
.menu-button{border:0;background:transparent;width:100%;padding:8px 10px;border-radius:7px;text-align:left;display:flex;align-items:center;gap:8px;color:var(--ink)}.menu-button:hover{background:var(--green-soft);color:var(--green-dark)}.menu-button.danger:hover{background:var(--red-soft);color:var(--red)}
.workspace{max-width:1460px;margin:0 auto;padding:27px 30px 50px}
.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:11px}.breadcrumb .current{color:#60665c}
.page-heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px}.page-heading h1{font-size:25px;line-height:1.3;margin:0 0 6px;letter-spacing:-.5px}.page-heading p{margin:0;color:var(--muted);font-size:13px}.page-tag{font-size:11px;color:#7b806f;background:var(--paper-soft);border:1px solid var(--line);border-radius:14px;padding:4px 10px;white-space:nowrap}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.placeholder{min-height:520px;display:flex;align-items:center;justify-content:center;text-align:center;padding:50px 24px;position:relative;overflow:hidden}
.placeholder:before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(130,169,83,.07),transparent 68%);top:50%;left:50%;transform:translate(-50%,-50%)}
.placeholder-inner{position:relative;max-width:520px}.module-emblem{width:76px;height:76px;border:1px solid #dfe6d3;border-radius:22px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;margin:0 auto 23px;transform:rotate(-3deg)}.module-emblem .icon{width:34px;height:34px;stroke-width:1.4}
.placeholder h2{font-size:23px;margin:0 0 11px}.placeholder-copy{font-size:16px;color:#777d70;letter-spacing:1px;margin:0 0 8px}.placeholder-desc{color:var(--muted);font-size:13px;margin:0 auto 26px;max-width:390px}
.btn{border:1px solid var(--line-dark);background:var(--paper);color:#53594f;border-radius:8px;padding:7px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;transition:.15s}.btn:hover{border-color:var(--green);color:var(--green-dark);background:var(--green-soft)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green-dark);color:#fff}.btn.small{padding:4px 9px;font-size:12px;border-radius:6px}.btn.danger{color:var(--red)}.btn:disabled{opacity:.55;cursor:not-allowed}
.user-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-bottom:20px}.card{padding:22px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.card-head h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}.card-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.profile{text-align:center}.profile-avatar{width:68px;height:68px;border-radius:20px;background:var(--green-soft);color:var(--green-dark);font-size:24px;font-weight:700;display:grid;place-items:center;margin:4px auto 14px}.profile h3{font-size:19px;margin:0 0 3px}.profile .username{color:var(--muted);font-size:12px}.role-badge,.status-badge{display:inline-flex;align-items:center;border-radius:12px;padding:2px 9px;font-size:11px;background:var(--green-soft);color:var(--green-dark);margin-top:12px}.role-badge.admin{background:#f2eadf;color:#8c6d43}.role-badge.viewer{background:#efeee9;color:#74776f}.status-badge{margin:0;background:var(--green-soft)}.status-badge.off{background:var(--red-soft);color:var(--red)}
.profile-meta{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);text-align:left}.meta-row{display:flex;justify-content:space-between;padding:7px 0;font-size:12px}.meta-row span{color:var(--muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:#666c61;margin-bottom:6px}.input{width:100%;border:1px solid var(--line-dark);background:#fffefa;border-radius:8px;padding:9px 11px;color:var(--ink);outline:none;transition:.15s}.input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(130,169,83,.11)}.input:disabled{background:#f4f1e9;color:var(--muted)}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.form-error{color:var(--red);font-size:12px;min-height:18px;margin:4px 0}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px;background:var(--paper-soft);padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #eee9dd;vertical-align:middle}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fffcf5}.user-cell{display:flex;align-items:center;gap:9px}.user-cell .avatar{width:30px;height:30px}.user-cell b{display:block;font-size:13px}.user-cell small{display:block;color:var(--muted);font-size:11px}.table-actions{display:flex;gap:6px;justify-content:flex-end}.role-select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:12px}
.login-page{min-height:100vh;display:grid;grid-template-columns:minmax(340px,1fr) minmax(400px,520px);background:var(--bg)}
.login-intro{display:flex;flex-direction:column;justify-content:center;padding:70px 9vw;position:relative;overflow:hidden}.login-intro:after{content:"";position:absolute;right:-130px;bottom:-130px;width:430px;height:430px;border:1px solid rgba(130,169,83,.18);border-radius:50%;box-shadow:0 0 0 55px rgba(130,169,83,.035),0 0 0 110px rgba(130,169,83,.025)}
.login-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:750;margin-bottom:52px}.login-intro h1{font-size:36px;line-height:1.3;letter-spacing:-1px;margin:0 0 18px;max-width:540px}.login-intro>p{font-size:15px;color:var(--muted);max-width:480px;margin:0 0 34px}.login-points{display:flex;gap:24px;color:#69705f;font-size:12px}.login-points span{display:flex;align-items:center;gap:6px}.login-points .icon{color:var(--green-dark)}
.login-side{display:flex;align-items:center;justify-content:center;padding:35px;background:rgba(255,253,248,.55);border-left:1px solid var(--line)}.login-card{width:100%;padding:34px 36px}.login-card h2{font-size:22px;margin:0 0 5px}.login-card .sub{color:var(--muted);font-size:12px;margin-bottom:26px}.login-btn{width:100%;padding:10px;margin-top:4px}.demo-accounts{margin-top:24px;padding-top:19px;border-top:1px solid var(--line)}.demo-title{font-size:11px;color:var(--muted);margin-bottom:9px}.account-list{display:flex;gap:7px}.account-chip{flex:1;border:1px solid var(--line);background:var(--paper-soft);border-radius:7px;padding:6px 3px;font-size:11px;color:#666c61}.account-chip:hover{border-color:var(--green);color:var(--green-dark)}.default-hint{font-size:11px;color:var(--muted);margin-top:10px;text-align:center}.default-hint code{color:#6d725f;background:#f2eee4;padding:1px 5px;border-radius:4px}
.modal-backdrop{position:fixed;inset:0;background:rgba(43,45,38,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:440px;max-width:100%;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(43,45,38,.22)}.modal h3{margin:0 0 4px;font-size:18px}.modal .modal-sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;background:#354137;color:#fff;padding:10px 17px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.18);font-size:13px;max-width:80vw}.toast.error{background:#934c45}
@media(max-width:1100px){.topbar{padding:0 14px;gap:12px}.brand small{display:none}.nav-link{padding:0 8px}.nav-count{display:none}.workspace{padding:22px 18px}.user-grid{grid-template-columns:280px 1fr}.login-intro{padding:50px 6vw}}
@media(max-width:820px){.topbar{height:auto;min-height:58px;flex-wrap:wrap;padding-top:7px}.main-nav{order:3;width:100%;overflow:auto;height:46px}.top-actions{margin-left:auto}.env{display:none}.user-grid{grid-template-columns:1fr}.login-page{grid-template-columns:1fr}.login-intro{display:none}.login-side{border:0;min-height:100vh}.page-heading{align-items:flex-start}.page-tag{display:none}.placeholder{min-height:440px}}
</style>
</head>
<body>
<section id="loginPage" class="login-page hidden">
  <div class="login-intro">
    <div class="login-brand"><span class="brand-mark" data-icon="grid"></span>DataGov <span class="muted" style="font-size:12px;font-weight:500">数据治理工作台</span></div>
    <h1>让数据治理<br>清晰、可控、可持续。</h1>
    <p>以两大引擎为底座，连接数据资产、业务语义与智能体应用，构建统一的数据治理工作入口。</p>
    <div class="login-points"><span data-icon-text="engine">两大引擎</span><span data-icon-text="apps">十一项应用</span><span data-icon-text="shield">统一权限</span></div>
  </div>
  <div class="login-side">
    <form id="loginForm" class="panel login-card">
      <h2>欢迎回来</h2><div class="sub">登录后进入数据治理工作台</div>
      <div class="field"><label for="loginUsername">用户名</label><input class="input" id="loginUsername" autocomplete="username" value="admin" required></div>
      <div class="field"><label for="loginPassword">密码</label><input class="input" id="loginPassword" type="password" autocomplete="current-password" value="abc123456789" required></div>
      <div id="loginError" class="form-error"></div>
      <button id="loginButton" class="btn primary login-btn" type="submit">登录工作台</button>
      <div class="demo-accounts"><div class="demo-title">演示账号（点击填充）</div><div class="account-list"><button type="button" class="account-chip" data-account="admin">管理员</button><button type="button" class="account-chip" data-account="governance">治理专员</button><button type="button" class="account-chip" data-account="viewer">只读用户</button></div><div class="default-hint">默认密码 <code>abc123456789</code></div></div>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <a href="#/overview" class="brand"><span class="brand-mark" data-icon="grid"></span><span>DataGov</span><small>数据治理工作台</small></a>
    <nav id="mainNav" class="main-nav" aria-label="主导航"></nav>
    <div class="top-actions">
      <span class="env"><span class="env-dot"></span>开发环境</span>
      <div id="userWrap" class="user-wrap">
        <button id="userButton" class="user-button" type="button"><span id="headerAvatar" class="avatar">U</span><span id="headerUsername">用户</span><span data-icon="chevron"></span></button>
        <div class="user-menu"><div class="user-summary"><b id="menuDisplayName"></b><span id="menuRole"></span></div><button class="menu-button" data-route="user-center"><span data-icon="user"></span>用户中心</button><button id="logoutButton" class="menu-button danger"><span data-icon="logout"></span>退出登录</button></div>
      </div>
    </div>
  </header>
  <div class="workspace">
    <div id="breadcrumb" class="breadcrumb"></div>
    <div class="page-heading"><div><h1 id="pageTitle"></h1><p id="pageDescription"></p></div><span id="pageTag" class="page-tag"></span></div>
    <main id="pageContent"></main>
  </div>
</div>

<div id="userModal" class="modal-backdrop hidden">
  <form id="createUserForm" class="modal">
    <h3>新建平台用户</h3><div class="modal-sub">新用户初始密码统一为 abc123456789</div>
    <div class="field"><label for="newUsername">用户名</label><input id="newUsername" class="input" pattern="[a-zA-Z0-9_.-]{3,32}" placeholder="3–32 位字母、数字或 _ . -" required></div>
    <div class="field"><label for="newDisplayName">姓名</label><input id="newDisplayName" class="input" maxlength="64" required></div>
    <div class="field"><label for="newRole">角色</label><select id="newRole" class="input"><option value="viewer">只读用户</option><option value="governance">治理专员</option><option value="admin">系统管理员</option></select></div>
    <div id="createUserError" class="form-error"></div>
    <div class="form-actions"><button id="cancelCreateUser" type="button" class="btn">取消</button><button class="btn primary" type="submit">创建用户</button></div>
  </form>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const API = '/api/v1';
const DEFAULT_PASSWORD = 'abc123456789';
const ROLE_NAMES = { admin: '系统管理员', governance: '治理专员', viewer: '只读用户' };
const ICONS = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  engine: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.35.24.63.56.81.93.12.25.37.44.65.51H21v4h-.09A1.7 1.7 0 0 0 19.4 15z"/>',
  apps: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/>',
  config: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  lock: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  logout: '<path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>',
  chevron: '<path d="m7 10 5 5 5-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const state = { token: localStorage.getItem('dgov_token') || '', user: null, groups: [], modules: {}, users: [] };
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const icon = (name, cls='') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.apps}</svg>`;

function hydrateIcons(root=document) {
  root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  root.querySelectorAll('[data-icon-text]').forEach(el => { el.innerHTML = icon(el.dataset.iconText) + esc(el.textContent); });
}
function toast(message, error=false) {
  const el = $('toast'); el.textContent = message; el.className = 'toast' + (error ? ' error' : '');
  clearTimeout(el._timer); el._timer = setTimeout(() => el.classList.add('hidden'), 2800);
}
async function request(path, options={}, authenticated=true) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (authenticated && state.token) headers.Authorization = `Bearer ${state.token}`;
  const response = await fetch(API + path, { ...options, headers });
  if (response.status === 401 && path !== '/auth/login') { clearSession(); throw new Error('登录状态已失效，请重新登录'); }
  let data = null;
  try { data = await response.json(); } catch (e) { data = null; }
  if (!response.ok) throw new Error(data?.detail || `请求失败（${response.status}）`);
  return data;
}
function clearSession() {
  state.token = ''; state.user = null; state.groups = []; state.modules = {};
  localStorage.removeItem('dgov_token'); $('app').classList.add('hidden'); $('loginPage').classList.remove('hidden');
  $('loginError').textContent = '';
}
function showApp() { $('loginPage').classList.add('hidden'); $('app').classList.remove('hidden'); }
function formatDate(value) { return value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '从未登录'; }
function initials(user) { return (user?.display_name || user?.username || 'U').slice(0, 1).toUpperCase(); }

async function bootstrap() {
  hydrateIcons();
  if (!state.token) { clearSession(); return; }
  try {
    state.user = await request('/auth/me');
    state.groups = await request('/platform/modules');
    indexModules(); renderShell(); showApp(); route();
  } catch (error) { if (state.token) clearSession(); }
}
function indexModules() {
  state.modules = {};
  state.groups.forEach(group => group.items.forEach(item => { state.modules[item.id] = { ...item, groupKey: group.key, groupTitle: group.title }; }));
}
function moduleLink(item, groupKey) {
  return `<button class="dropdown-link" data-module="${esc(item.id)}"><span class="item-icon">${icon(groupKey === 'engines' ? 'engine' : groupKey === 'configurations' ? 'config' : 'apps')}</span><span><b>${esc(item.name)}</b><small>${esc(item.description)}</small></span></button>`;
}
function renderShell() {
  const engines = state.groups.find(g => g.key === 'engines');
  const applications = state.groups.find(g => g.key === 'applications');
  const configurations = state.groups.find(g => g.key === 'configurations');
  const overview = applications?.items.find(item => item.id === 'overview');
  $('mainNav').innerHTML = `
    <div class="nav-item"><button class="nav-link" data-module="overview">${icon('grid')}${esc(overview?.name || '总览视图')}</button></div>
    ${(engines?.items || []).map(item => `<div class="nav-item"><button class="nav-link" data-module="${esc(item.id)}">${icon('engine')}${esc(item.name)}</button></div>`).join('')}
    <div class="nav-item" data-dropdown="applications"><button class="nav-link" data-toggle="applications">${icon('apps')}应用功能<span class="nav-count">${applications?.items.length || 0}</span>${icon('chevron','chevron')}</button><div class="dropdown"><div class="dropdown-title">应用功能</div>${(applications?.items || []).map(item => moduleLink(item, 'applications')).join('')}</div></div>
    <div class="nav-item" data-dropdown="configurations"><button class="nav-link" data-toggle="configurations">${icon('config')}管理配置<span class="nav-count">${configurations?.items.length || 0}</span>${icon('chevron','chevron')}</button><div class="dropdown"><div class="dropdown-title">管理配置</div>${(configurations?.items || []).map(item => moduleLink(item, 'configurations')).join('')}</div></div>
    <div class="nav-item"><button class="nav-link" data-route="user-center">${icon('user')}用户中心</button></div>`;
  $('headerAvatar').textContent = initials(state.user); $('headerUsername').textContent = state.user.display_name;
  $('menuDisplayName').textContent = `${state.user.display_name} · ${state.user.username}`;
  $('menuRole').textContent = ROLE_NAMES[state.user.role] || state.user.role;
}
function currentRoute() {
  const hash = location.hash.replace(/^#\/?/, '');
  if (hash === 'user-center') return { type: 'user-center', id: 'user-center' };
  if (hash.startsWith('module/')) {
    const id = decodeURIComponent(hash.slice(7));
    if (state.modules[id]) return { type: 'module', id };
  }
  return { type: 'module', id: 'overview' };
}
function setHeading(title, description, group, tag) {
  $('pageTitle').textContent = title; $('pageDescription').textContent = description;
  $('pageTag').textContent = tag || group;
  $('breadcrumb').innerHTML = `<span>数据治理工作台</span><span>/</span><span>${esc(group)}</span><span>/</span><span class="current">${esc(title)}</span>`;
}
function updateActive(id) {
  document.querySelectorAll('.nav-link,.dropdown-link').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`[data-module="${CSS.escape(id)}"],[data-route="${CSS.escape(id)}"]`).forEach(el => {
    if (el.classList.contains('nav-link') || el.classList.contains('dropdown-link')) el.classList.add('active');
  });
  const item = state.modules[id];
  if (item?.groupKey === 'applications' || item?.groupKey === 'configurations') {
    document.querySelector(`[data-toggle="${item.groupKey}"]`)?.classList.add('active');
  }
}
function route() {
  if (!state.user) return;
  closeMenus();
  const current = currentRoute();
  if (current.type === 'user-center') { renderUserCenter(); updateActive('user-center'); return; }
  const item = state.modules[current.id];
  if (!item) return;
  setHeading(item.name, item.description, item.groupTitle, item.implemented ? '已上线' : '功能规划中');
  if (item.implemented) { renderUserCenter(); updateActive(item.id); return; }
  $('pageContent').innerHTML = `<section class="panel placeholder"><div class="placeholder-inner"><div class="module-emblem">${icon(item.groupKey === 'engines' ? 'engine' : item.groupKey === 'configurations' ? 'config' : 'apps')}</div><h2>${esc(item.name)}</h2><p class="placeholder-copy">敬请期待功能上线......</p><p class="placeholder-desc">${esc(item.description)}。模块骨架已接入统一导航与权限体系。</p>${item.id === 'overview' ? '' : `<button class="btn" data-module="overview">${icon('arrow')}返回总览视图</button>`}</div></section>`;
  updateActive(item.id);
}
function closeMenus() { document.querySelectorAll('.nav-item.open,.user-wrap.open').forEach(el => el.classList.remove('open')); }

function renderUserCenter() {
  setHeading('用户中心', '管理个人资料、登录密码与平台用户', '管理配置', '已上线');
  const canManage = state.user.permissions.includes('users:manage');
  $('pageContent').innerHTML = `
    <div class="user-grid">
      <section class="panel card profile"><div class="profile-avatar">${esc(initials(state.user))}</div><h3>${esc(state.user.display_name)}</h3><div class="username">@${esc(state.user.username)}</div><span class="role-badge ${esc(state.user.role)}">${esc(ROLE_NAMES[state.user.role])}</span><div class="profile-meta"><div class="meta-row"><span>账号状态</span><b>${state.user.is_active ? '正常' : '已停用'}</b></div><div class="meta-row"><span>最近登录</span><b>${esc(formatDate(state.user.last_login_at))}</b></div><div class="meta-row"><span>权限项</span><b>${state.user.permissions.length} 项</b></div></div></section>
      <section class="panel card"><div class="card-head"><div><h2>${icon('lock')}修改登录密码</h2><p>修改成功后需要重新登录，密码至少 10 位</p></div></div><form id="passwordForm"><div class="field"><label for="currentPassword">当前密码</label><input id="currentPassword" class="input" type="password" autocomplete="current-password" required></div><div class="form-row"><div class="field"><label for="newPassword">新密码</label><input id="newPassword" class="input" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" class="input" type="password" minlength="10" autocomplete="new-password" required></div></div><div id="passwordError" class="form-error"></div><div class="form-actions"><button class="btn primary" type="submit">更新密码</button></div></form></section>
    </div>
    ${canManage ? `<section class="panel card"><div class="card-head"><div><h2>${icon('users')}平台用户</h2><p>分配角色、启停账号与重置默认密码</p></div><button id="openCreateUser" class="btn primary small">${icon('plus')}新建用户</button></div><div class="table-wrap"><table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>最近登录</th><th style="text-align:right">操作</th></tr></thead><tbody id="userTableBody"><tr><td colspan="5" class="muted">正在加载用户...</td></tr></tbody></table></div></section>` : ''}`;
  $('passwordForm').addEventListener('submit', changePassword);
  if (canManage) { $('openCreateUser').addEventListener('click', openCreateUser); loadUsers(); }
}
async function loadUsers() {
  try { state.users = await request('/users'); renderUserTable(); }
  catch (error) { $('userTableBody').innerHTML = `<tr><td colspan="5">${esc(error.message)}</td></tr>`; }
}
function renderUserTable() {
  const body = $('userTableBody'); if (!body) return;
  body.innerHTML = state.users.map(user => `<tr><td><div class="user-cell"><span class="avatar">${esc(initials(user))}</span><span><b>${esc(user.display_name)}</b><small>@${esc(user.username)}</small></span></div></td><td><select class="role-select" data-user-role="${user.id}" ${user.id === state.user.id ? 'disabled' : ''}>${Object.entries(ROLE_NAMES).map(([key,name]) => `<option value="${key}" ${user.role === key ? 'selected' : ''}>${name}</option>`).join('')}</select></td><td><span class="status-badge ${user.is_active ? '' : 'off'}">${user.is_active ? '正常' : '已停用'}</span></td><td class="muted">${esc(formatDate(user.last_login_at))}</td><td><div class="table-actions"><button class="btn small" data-reset-user="${user.id}">重置密码</button><button class="btn small ${user.is_active ? 'danger' : ''}" data-toggle-user="${user.id}" ${user.id === state.user.id ? 'disabled' : ''}>${user.is_active ? '停用' : '启用'}</button></div></td></tr>`).join('');
}
async function changePassword(event) {
  event.preventDefault();
  const current = $('currentPassword').value, next = $('newPassword').value, confirm = $('confirmPassword').value;
  if (next !== confirm) { $('passwordError').textContent = '两次输入的新密码不一致'; return; }
  try {
    await request('/auth/password', { method: 'POST', body: JSON.stringify({ current_password: current, new_password: next }) });
    toast('密码已更新，请使用新密码重新登录'); setTimeout(clearSession, 900);
  } catch (error) { $('passwordError').textContent = error.message; }
}
function openCreateUser() { $('createUserForm').reset(); $('createUserError').textContent = ''; $('userModal').classList.remove('hidden'); $('newUsername').focus(); }
async function createUser(event) {
  event.preventDefault();
  try {
    await request('/users', { method: 'POST', body: JSON.stringify({ username: $('newUsername').value.trim(), display_name: $('newDisplayName').value.trim(), role: $('newRole').value }) });
    $('userModal').classList.add('hidden'); toast(`用户创建成功，默认密码为 ${DEFAULT_PASSWORD}`); await loadUsers();
  } catch (error) { $('createUserError').textContent = error.message; }
}
async function updateUser(id, payload, message) {
  try { await request(`/users/${id}`, { method: 'PATCH', body: JSON.stringify(payload) }); toast(message); await loadUsers(); }
  catch (error) { toast(error.message, true); await loadUsers(); }
}
async function resetUser(id) {
  try { const result = await request(`/users/${id}/reset-password`, { method: 'POST' }); toast(result.detail); }
  catch (error) { toast(error.message, true); }
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault(); $('loginError').textContent = ''; $('loginButton').disabled = true; $('loginButton').textContent = '正在登录...';
  try {
    const result = await request('/auth/login', { method: 'POST', body: JSON.stringify({ username: $('loginUsername').value.trim(), password: $('loginPassword').value }) }, false);
    state.token = result.token; state.user = result.user; localStorage.setItem('dgov_token', state.token);
    state.groups = await request('/platform/modules'); indexModules(); renderShell(); showApp();
    if (!location.hash) location.hash = '#/overview'; else route();
  } catch (error) { $('loginError').textContent = error.message; }
  finally { $('loginButton').disabled = false; $('loginButton').textContent = '登录工作台'; }
});
$('logoutButton').addEventListener('click', async () => { try { await request('/auth/logout', { method: 'POST' }); } catch (e) {} clearSession(); });
$('userButton').addEventListener('click', event => { event.stopPropagation(); const wrap = $('userWrap'); const wasOpen = wrap.classList.contains('open'); closeMenus(); if (!wasOpen) wrap.classList.add('open'); });
$('cancelCreateUser').addEventListener('click', () => $('userModal').classList.add('hidden'));
$('userModal').addEventListener('click', event => { if (event.target === $('userModal')) $('userModal').classList.add('hidden'); });
$('createUserForm').addEventListener('submit', createUser);
document.addEventListener('click', event => {
  const account = event.target.closest('[data-account]');
  if (account) { $('loginUsername').value = account.dataset.account; $('loginPassword').value = DEFAULT_PASSWORD; return; }
  const toggle = event.target.closest('[data-toggle]');
  if (toggle) { event.stopPropagation(); const parent = toggle.closest('.nav-item'); const wasOpen = parent.classList.contains('open'); closeMenus(); if (!wasOpen) parent.classList.add('open'); return; }
  const routeButton = event.target.closest('[data-route]');
  if (routeButton) { location.hash = `#/${routeButton.dataset.route}`; closeMenus(); return; }
  const moduleButton = event.target.closest('[data-module]');
  if (moduleButton) { const id = moduleButton.dataset.module; location.hash = id === 'user-center' ? '#/user-center' : `#/module/${id}`; closeMenus(); return; }
  const roleSelect = event.target.closest('[data-user-role]');
  if (roleSelect) return;
  const reset = event.target.closest('[data-reset-user]'); if (reset) { resetUser(Number(reset.dataset.resetUser)); return; }
  const toggleUser = event.target.closest('[data-toggle-user]');
  if (toggleUser) { const user = state.users.find(item => item.id === Number(toggleUser.dataset.toggleUser)); if (user) updateUser(user.id, { is_active: !user.is_active }, user.is_active ? '账号已停用' : '账号已启用'); return; }
  if (!event.target.closest('.nav-item,.user-wrap')) closeMenus();
});
document.addEventListener('change', event => { const select = event.target.closest('[data-user-role]'); if (select) updateUser(Number(select.dataset.userRole), { role: select.value }, '用户角色已更新'); });
window.addEventListener('hashchange', route);
bootstrap();
</script>
</body>
</html>
